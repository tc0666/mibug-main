name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy Project Artifacts to Vercel
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Check Database Connection
      run: |
        echo "Checking if database is accessible..."
        # This will be handled by the app's auto-initialization
        echo "Database will auto-initialize on first request"

    - name: Deployment Summary
      run: |
        echo "🎉 Deployment completed!"
        echo "📋 Post-deployment checklist:"
        echo "   ✅ App deployed to Vercel"
        echo "   ✅ Database will auto-initialize"
        echo "   ✅ Admin user will be created"
        echo "   ⚠️  Ensure POSTGRES_URL is set in Vercel"
        echo "   ⚠️  Ensure ADMIN_USER and ADMIN_PASSWORD are set"
