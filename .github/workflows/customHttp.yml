customHttp:
  headers:
    - key: X-Frame-Options
      value: "DENY"
    - key: Strict-Transport-Security
      value: "max-age=31536000; includeSubDomains"
    - key: Content-Security-Policy
      value: "default-src 'self'; script-src 'self';"
    - key: X-XSS-Protection
      value: "1; mode=block"
    - key: X-Content-Type-Options
      value: "nosniff"
